<div class="wrap grid-cards">
  @for (card of cards(); track card.participant.id) {
    <div
      class="panel-md"
      style="padding: 13px; display: flex; flex-direction: column; gap: 10px"
      [style.box-shadow]="card.mine ? '0 0 0 1px var(--color-accent-700)' : 'var(--shadow-sm)'"
    >
      <div class="row" style="gap: 10px">
        <app-avatar
          [name]="card.participant.name"
          [color]="card.participant.color"
          [src]="card.participant.avatarUrl"
          [size]="36"
        />
        <span class="grow">
          <span class="ellipsis" style="display: block; font-weight: 500; font-size: 15px">
            {{ card.participant.teamName }}
          </span>
          <span class="hint" style="display: block">{{ card.participant.name }}</span>
        </span>
        <span class="credits" [class.is-low]="card.low" style="font-size: 18px">
          {{ card.participant.budget }}
        </span>
      </div>

      <div class="grid-4" style="gap: 5px">
        <app-role-counters [participant]="card.participant" />
      </div>

      <div class="hint" style="min-height: 16px">{{ card.last }}</div>
    </div>
  }
</div>
