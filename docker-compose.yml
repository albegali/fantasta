services:
  db:
    image: postgres:16-alpine
    container_name: fantasta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fantasta
      POSTGRES_PASSWORD: fantasta
      POSTGRES_DB: fantasta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
